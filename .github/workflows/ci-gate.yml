name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    permissions:
      contents: read
      pull-requests: read
      actions: write
    # No with: the shared defaults are already the markdown-only profile.
    uses: JacobPEvans/.github/.github/workflows/_ci-gate.yml@topic/merge-flow-r2 # fixture: follows the topic branch
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
